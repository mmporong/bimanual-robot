name: Auto PR

on:
  push:
    branches-ignore:
      - main

permissions:
  actions: write
  contents: write
  issues: write
  pull-requests: write

concurrency:
  group: auto-pr-${{ github.ref }}
  cancel-in-progress: true

jobs:
  create-or-update:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      BRANCH: ${{ github.ref_name }}
    steps:
      - name: 저장소 체크아웃
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262e
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 0

      - name: Python 3.12 준비
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.12"

      - name: README 자동 상태 동기화
        id: readme
        shell: bash
        run: |
          python -m pip install --disable-pip-version-check PyYAML==6.0.2
          python tools/ci/sync_readme_status.py --write
          if git diff --quiet -- README.md; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add README.md
            git commit -m "docs(readme): 단일 원본 자동 요약 동기화"
            git push origin "HEAD:$BRANCH"
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: README 갱신 커밋 재검증 요청
        if: steps.readme.outputs.changed == 'true'
        run: gh workflow run pr-gate.yml --ref "$BRANCH"

      - name: PR 생성 또는 조회
        id: pr
        shell: bash
        run: |
          number=$(gh pr list --head "$BRANCH" --state open --json number --jq '.[0].number // empty')
          if [ -z "$number" ]; then
            title=$(python -c 'import json,os; d=json.load(open(os.environ["GITHUB_EVENT_PATH"])); print((d.get("head_commit") or {}).get("message", "자동 생성 PR").splitlines()[0])')
            body=$(cat <<'EOF'
          ## 바꾼 내용

          브랜치 push를 감지한 자동화가 PR을 만들었습니다. 변경 파일과 커밋을 기준으로 검증합니다.

          ## 검증

          `PR gate / validate`가 YAML, Python, Markdown 링크, 회귀 테스트, URDF·Xacro 계약을 검사합니다.

          ## 실패와 한계

          실물 팔·서보·주행 시험은 실행하지 않습니다. 관련 변경은 자동 병합하지 않습니다.
          EOF
          )
            url=$(gh pr create --base main --head "$BRANCH" --title "$title" --body "$body")
            number=${url##*/}
          fi
          echo "number=$number" >> "$GITHUB_OUTPUT"

      - name: 위험도 분류와 자동 병합 예약
        shell: bash
        env:
          PR_NUMBER: ${{ steps.pr.outputs.number }}
        run: |
          files=$(gh pr view "$PR_NUMBER" --json files --jq '.files[].path')
          risk=medium
          if printf '%s\n' "$files" | grep -Eq '^(firmware/|tools/servo/)'; then
            risk=hardware
          elif printf '%s\n' "$files" | grep -Eq '^\.github/'; then
            risk=automation
          elif printf '%s\n' "$files" | grep -Eq '^(src/|design/mechanical/)'; then
            risk=high
          elif [ -n "$files" ] && printf '%s\n' "$files" | grep -Evq '^(docs/|README\.md$)'; then
            risk=medium
          else
            risk=low
          fi

          for label in risk:low risk:medium risk:high risk:hardware risk:automation; do
            gh pr edit "$PR_NUMBER" --remove-label "$label" >/dev/null 2>&1 || true
          done
          gh pr edit "$PR_NUMBER" --add-label "risk:$risk"

          marker='<!-- hold-flow-pr-bot -->'
          if [ "$risk" = low ]; then
            decision='필수 검사가 통과하면 squash 방식으로 자동 병합합니다.'
          else
            decision='자동 병합 대상이 아닙니다. 검증 결과를 확인한 뒤 병합해야 합니다.'
          fi
          body="$marker
          위험도: \`risk:$risk\`

          $decision

          실물 로봇 명령은 실행하지 않습니다."
          comment_id=$(gh api "repos/$GH_REPO/issues/$PR_NUMBER/comments" --paginate \
            --jq ".[] | select(.body | contains(\"$marker\")) | .id" | head -n 1)
          if [ -n "$comment_id" ]; then
            gh api --method PATCH "repos/$GH_REPO/issues/comments/$comment_id" -f body="$body" >/dev/null
          else
            gh api --method POST "repos/$GH_REPO/issues/$PR_NUMBER/comments" -f body="$body" >/dev/null
          fi

          if [ "$risk" = low ]; then
            gh pr merge "$PR_NUMBER" --auto --squash
          fi
