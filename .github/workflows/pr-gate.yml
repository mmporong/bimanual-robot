name: PR gate

on:
  workflow_dispatch:
  pull_request:
  push:
    branches-ignore:
      - main

permissions:
  contents: read

concurrency:
  group: pr-gate-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: validate
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: 저장소 체크아웃
        id: checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262e
        with:
          fetch-depth: 0

      - name: Python 3.12 준비
        id: python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.12"

      - name: 검증 의존성 설치
        id: dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y liburdfdom-tools
          python -m pip install --disable-pip-version-check \
            jsonschema==4.23.0 numpy==2.2.3 \
            opencv-contrib-python-headless==4.11.0.86 \
            pytest==8.3.5 PyYAML==6.0.2 vtk==9.4.2 xacro==2.1.1

      - name: 변경 diff 형식 검사
        id: diff
        env:
          EVENT_NAME: ${{ github.event_name }}
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PUSH_BEFORE_SHA: ${{ github.event.before }}
        run: |
          if [ "$EVENT_NAME" = "pull_request" ]; then
            git diff --check "$PR_BASE_SHA...$GITHUB_SHA"
          elif [ -n "$PUSH_BEFORE_SHA" ] && ! printf '%s' "$PUSH_BEFORE_SHA" | grep -Eq '^0+$'; then
            git diff --check "$PUSH_BEFORE_SHA..$GITHUB_SHA"
          else
            git diff --check "$GITHUB_SHA^..$GITHUB_SHA"
          fi

      - name: YAML과 Python 구문 검사
        id: syntax
        run: |
          python - <<'PY'
          import subprocess
          from pathlib import Path
          import yaml

          paths = subprocess.check_output(
              ["git", "ls-files", "-z", "--", "*.yaml", "*.yml"]
          ).split(b"\0")
          for raw_path in paths:
              if not raw_path:
                  continue
              path = Path(raw_path.decode())
              with path.open(encoding="utf-8") as file:
                  yaml.safe_load(file)
              print("YAML OK:", path)
          PY
          python -m compileall -q data design src tools tests

      - name: Markdown 로컬 링크 검사
        id: docs
        run: |
          python tools/ci/check_local_markdown_links.py
          python tools/ci/sync_readme_status.py

      - name: 단위·회귀 테스트
        id: tests
        run: python -m pytest -q

      - name: URDF·Xacro 계약 검사
        id: model
        run: python src/hold_flow_description/scripts/validate_description.py

      - name: 실패 원인과 수정 후 검증 안내
        if: failure()
        env:
          STEP_RESULTS: ${{ toJSON(steps) }}
        run: |
          python3 - <<'PY'
          import json
          import os
          from pathlib import Path

          fixes = {
              'checkout': ('저장소 체크아웃', 'checkout 로그에서 대상 ref와 접근 권한을 확인하고 사라진 ref 또는 권한 오류를 수정한다.'),
              'python': ('Python 준비', 'setup-python 로그의 다운로드·버전 오류를 확인하고 Python 3.12 준비 후 검증을 재실행한다.'),
              'dependencies': ('검증 환경 설치', '패키지 설치 로그의 버전·저장소·네트워크 오류를 수정한다. 같은 버전으로 환경을 준비한 뒤 검증을 재실행한다.'),
              'diff': ('diff 형식', '`git diff --check`로 공백 오류 위치를 확인하고 수정한다.'),
              'syntax': ('YAML·Python 구문', '로그의 파일·행 번호를 수정하고 `python3 -m compileall -q data design src tools tests`와 실패한 YAML 구문 검사를 재실행한다.'),
              'docs': ('문서 링크·README', '`python3 tools/ci/check_local_markdown_links.py`로 끊어진 링크를 고치고 `python3 tools/ci/sync_readme_status.py --write` 후 diff를 확인한다.'),
              'tests': ('회귀 테스트', '로그에 나온 실패 test node를 `python3 -m pytest -q <파일::테스트>`로 재현한다. 코드·회귀 테스트 수정 뒤 `python3 -m pytest -q`를 통과시킨다.'),
              'model': ('모델 계약', '`python3 src/hold_flow_description/scripts/validate_description.py`를 실행하고 로그의 관절·충돌·관성 계약 위반을 수정한다.'),
          }
          steps = json.loads(os.environ['STEP_RESULTS'])
          lines = ['## 실패한 검사와 해결 방법', '']
          for key, (label, fix) in fixes.items():
              if steps.get(key, {}).get('outcome') == 'failure':
                  lines.append(f'- {label}: {fix}')
          if len(lines) == 2:
              lines.append('- 환경 준비 또는 체크아웃 로그를 확인하고 표시된 오류를 수정한다.')
          lines += ['', '수정 파일만 커밋·push하면 검사가 다시 실행된다. 필수 검사 통과 후 자동 병합되며 위험도만으로 제외하지 않는다.', '']
          with Path(os.environ['GITHUB_STEP_SUMMARY']).open('a', encoding='utf-8') as stream:
              stream.write('\n'.join(lines))
          PY
