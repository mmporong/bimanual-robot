<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>컵 파지 카메라 관제</title>
<style>
  :root{--bg:#dfe6ea;--paper:#f7fafb;--ink:#172129;--muted:#65747e;
    --line:#bcc9d0;--live:#087c67;--fault:#b73b3b;--blue:#21657a;--stage:#080d10}
  *{box-sizing:border-box} html,body{height:100%}
  body{margin:0;background:var(--bg);color:var(--ink);font-family:"Noto Sans KR","Malgun Gothic",sans-serif}
  main{height:100dvh;display:grid;grid-template-rows:auto auto minmax(0,1fr) auto;gap:10px;padding:10px 12px}
  header{display:flex;align-items:center;gap:18px;background:var(--paper);border:1px solid var(--line);padding:10px 14px}
  h1{font-size:17px;margin:0;letter-spacing:-.02em} header p{margin:0;color:var(--muted);font-size:12px}
  .readonly{margin-left:auto;border-left:4px solid var(--blue);padding:4px 0 4px 10px;font-size:12px;font-weight:700}
  .feeds{min-height:0;display:grid;grid-template-columns:minmax(0,2fr) minmax(280px,1fr);gap:8px}
  .feeds>figure:first-child{grid-row:span 2}
  .stop-panel{display:flex;align-items:center;gap:16px;background:var(--paper);padding:10px 14px;border:1px solid var(--line)}
  #stop{background:#a21b25;color:white;border:2px solid #75131a;border-radius:6px;padding:15px 24px;font-family:inherit;font-size:20px;font-weight:700;cursor:pointer;min-width:190px}
  #stop:focus-visible{outline:4px solid #21657a;outline-offset:3px}#stop:disabled{opacity:.6;cursor:wait}
  .stop-copy{font-size:12px}.stop-copy p{margin:4px 0}#stop-status{font-weight:700}
  figure{position:relative;min-width:0;min-height:0;margin:0;background:var(--stage);border:1px solid #293940;overflow:hidden}
  figure img{display:block;width:100%;height:100%;object-fit:contain}
  figcaption{position:absolute;left:9px;top:9px;background:rgba(4,10,13,.78);color:#edf7f8;padding:6px 9px;font-size:12px;font-weight:700}
  .health{position:absolute;right:9px;top:9px;display:flex;align-items:center;gap:6px;background:rgba(4,10,13,.78);color:#d7e3e7;padding:5px 8px;font-size:11px}
  .dot{width:8px;height:8px;border-radius:50%;background:var(--fault)} .online .dot{background:#27d3a8}
  footer{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
  .camera-row{background:var(--paper);border:1px solid var(--line);padding:8px 11px;display:grid;grid-template-columns:auto 1fr auto;gap:8px 12px;align-items:center}
  .camera-row b{font-size:12px}.path{color:var(--muted);font:11px ui-monospace,SFMono-Regular,Consolas,monospace;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .metrics{font:11px ui-monospace,SFMono-Regular,Consolas,monospace;text-align:right}
  .warning{color:#f2c166}
  @media(max-width:850px){main{height:auto;min-height:100dvh}.feeds{grid-template-columns:1fr;grid-template-rows:50vh 35vh 35vh}.feeds>figure:first-child{grid-row:auto}footer{grid-template-columns:1fr}.readonly{display:none}.stop-panel{position:sticky;top:0;z-index:5;flex-wrap:wrap}}
  @media(prefers-reduced-motion:reduce){*{scroll-behavior:auto!important}}
</style>
</head>
<body>
<main>
  <header>
    <h1>컵 파지 카메라 관제</h1>
    <p>상단과 손목 카메라 2대의 실시간 영상</p>
    <div class="readonly">이동·토크 ON 기능 없음</div>
  </header>
  <section class="stop-panel" aria-label="양팔 정지">
    <button id="stop" type="button" disabled>양팔 긴급정지</button>
    <div class="stop-copy"><p id="stop-status" role="status" aria-live="polite">정지 연결 확인 중</p>
    <p>토크 OFF: 팔이 내려앉거나 물체가 떨어질 수 있습니다. 하드웨어 전원 차단은 아닙니다.</p>
    <p>다른 제어기가 포트를 사용하거나 통신이 끊기면 정지할 수 없습니다. 실패 시 모터 전원을 차단하세요.</p>
    <p id="stop-detail"></p></div>
  </section>
  <section class="feeds">
    <figure><img src="/stream/top" alt="상단 RGB 실시간 영상"><figcaption>상단 RGB · 컵 위치</figcaption><div class="health" id="top-health"><span class="dot"></span><span>연결 확인 중</span></div></figure>
    <figure><img src="/stream/wrist" alt="손목 A RGB 실시간 영상"><figcaption>손목 A RGB</figcaption><div class="health" id="wrist-health"><span class="dot"></span><span>연결 확인 중</span></div></figure>
    <figure><img src="/stream/wrist_other" alt="손목 B RGB 실시간 영상"><figcaption>손목 B RGB</figcaption><div class="health" id="wrist_other-health"><span class="dot"></span><span>연결 확인 중</span></div></figure>
  </section>
  <footer>
    <div class="camera-row"><b>상단</b><span class="path" id="top-path">-</span><span class="metrics" id="top-metrics">-</span></div>
    <div class="camera-row"><b>손목 A</b><span class="path" id="wrist-path">-</span><span class="metrics" id="wrist-metrics">-</span></div>
    <div class="camera-row"><b>손목 B</b><span class="path" id="wrist_other-path">-</span><span class="metrics" id="wrist_other-metrics">-</span></div>
  </footer>
</main>
<script>
async function refresh(){
  try{
    const response=await fetch('/api/status',{cache:'no-store'});
    const status=await response.json();
    for(const name of ['top','wrist','wrist_other']){
      const item=status[name], health=document.getElementById(name+'-health');
      health.classList.toggle('online',Boolean(item.online));
      health.querySelector('span:last-child').textContent=item.online?'실시간':'오프라인';
      document.getElementById(name+'-path').textContent=item.path;
      const age=item.frame_age_ms===null?'--':item.frame_age_ms+' ms';
      document.getElementById(name+'-metrics').textContent=`${item.width}×${item.height} · #${item.sequence} · ${age}`;
    }
  }catch(error){
    for(const name of ['top','wrist','wrist_other']) {
      const health=document.getElementById(name+'-health');health.classList.remove('online');
      health.querySelector('span:last-child').textContent='상태 API 오류';
    }
  }
}
const stopButton=document.getElementById('stop');
let stopping=false;
function showStop(state){
  stopButton.disabled=!state.enabled||state.running||stopping;
  document.getElementById('stop-status').textContent=state.running?'토크 OFF 전송 중':
    !state.enabled?'정지 포트 미설정':!state.requested?'정지 버튼 사용 가능 · 현재 토크 상태 미측정':
    state.verified_off?'마지막 정지 요청: 서보 12개 토크 OFF 확인 (현재 상태 보증 아님)':
    '정지 확인 실패 · 모터 전원을 차단하세요';
  document.getElementById('stop-detail').textContent=(state.results||[]).map(r=>
    r.port.split('/').pop()+': '+(r.error||r.servos.map(s=>`${s.id}:${s.torque===0?'OFF':'미확인'}`).join(' '))
  ).join(' / ')+(state.log_error?' · 정지 기록 저장 실패':'');
}
async function refreshStop(){
  try{const r=await fetch('/api/stop/status',{cache:'no-store'});if(!r.ok)throw Error();showStop(await r.json());}
  catch(e){document.getElementById('stop-status').textContent='정지 서버 연결 실패 · 필요 시 모터 전원을 차단하세요';}
}
stopButton.addEventListener('click',async()=>{
  stopping=true;stopButton.disabled=true;document.getElementById('stop-status').textContent='토크 OFF 전송 중';
  try{const r=await fetch('/api/stop',{method:'POST',headers:{'X-Stop-Token':'__STOP_TOKEN__'}});
    const state=await r.json();stopping=false;showStop(state);
  }catch(e){stopping=false;stopButton.disabled=false;document.getElementById('stop-status').textContent='정지 응답 확인 불가 · 모터 전원을 차단하세요';}
});
refresh();refreshStop();setInterval(refresh,1000);setInterval(refreshStop,1000);
</script>
</body>
</html>
