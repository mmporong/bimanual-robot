  notes:
    - 같은 개방각에서 고정 죠와 이동 죠 여유를 균형화한 메시 단면 후보다.
    - 기존 70 mm 컵의 접촉 중심과 60 mm 후퇴를 재사용하지 않는다.
    - 이 개방각은 모델 값이며 보정 JSON의 퍼센트나 raw에 자동 대응시키지 않는다.
    - 뒤 80 mm·몸통 높이 후보는 손목 한계로 수평 정렬 조건을 만족하지 못했다.
    - 활성 준비 후보는 뒤 80 mm·높이 170 mm에서 컵 위·높이 170 mm로 이동한다.
    - 무접촉 준비 후보이며 컵을 닫아 잡는 명령을 포함하지 않는다.
notes:
  - 컵 중간 목표 높이는 책상 위 0.050 m로 계산한다.
  - 이 상대좌표를 이동 베이스의 base_footprint 실측값으로 표시하지 않는다.
  - 원점 대응과 관절 영점 대조 전에는 수치 IK 해를 실물 실행 승인 근거로 사용하지 않는다.
