# Wheel velocity + bias-corrected gyro yaw rate. real_bringup_imu.launch.py
# remaps the raw wheel stream and makes this filter the sole odom TF source.
ekf_filter_node:
  ros__parameters:
    frequency: 30.0
    sensor_timeout: 0.2
    two_d_mode: true
    publish_tf: true
    map_frame: map
    odom_frame: odom
    base_link_frame: base_footprint
    world_frame: odom
    # vx, vy (0 for a differential base) and vyaw from the wheels; the driver's twist
    # covariance is 1e-3 for vx and 1e-2 for vyaw. Wheel yaw remains available
    # as a fallback; corrected gyro rate has the stronger measurement weight.
    odom0: /odom
    odom0_config: [false, false, false,
                   false, false, false,
                   true,  true,  false,
                   false, false, true,
                   false, false, false]
    odom0_differential: false
    # vyaw from the bias-removed gyro (imu_bias_relay, variance 2.5e-5), so the fused
    # yaw rate follows the gyro. Accelerations are not fused: the board position and
    # accelerometer scale (0.95 g at rest) are not calibrated.
    imu0: /imu/data
    imu0_config: [false, false, false,
                  false, false, false,
                  false, false, false,
                  false, false, true,
                  false, false, false]
    imu0_differential: false
    imu0_remove_gravitational_acceleration: false
