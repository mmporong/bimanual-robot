<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="980" viewBox="0 0 1600 980" role="img" aria-labelledby="title desc">
  <title id="title">HOLD THE FLOW 이동형 양팔 붓기 구현 아키텍처</title>
  <desc id="desc">미션 관리에서 내비게이션, 로컬 정렬, IK와 ACT, 안전 게이트, 하드웨어까지 이어지는 계층 구조</desc>
  <defs>
    <style>
      text { font-family: Pretendard, "Noto Sans KR", "Apple SD Gothic Neo", Arial, sans-serif; }
      .eyebrow { font-size: 18px; font-weight: 700; letter-spacing: 2.8px; fill: #1261ff; }
      .title { font-size: 48px; font-weight: 800; letter-spacing: -1.2px; fill: #111827; }
      .subtitle { font-size: 23px; font-weight: 450; fill: #596579; }
      .layer-label { font-size: 16px; font-weight: 800; letter-spacing: 1.8px; fill: #7a879b; }
      .card-title { font-size: 26px; font-weight: 760; fill: #111827; }
      .card-copy { font-size: 19px; font-weight: 450; fill: #596579; }
      .chip { font-size: 15px; font-weight: 800; letter-spacing: .7px; }
      .flow-label { font-size: 16px; font-weight: 800; fill: #1261ff; }
      .footer { font-size: 17px; font-weight: 650; fill: #46546a; }
    </style>
    <marker id="arrow-blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#1261ff"/>
    </marker>
    <marker id="arrow-slate" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#98a4b5"/>
    </marker>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="130%">
      <feDropShadow dx="0" dy="6" stdDeviation="12" flood-color="#1d3b6b" flood-opacity=".08"/>
    </filter>
  </defs>

  <rect width="1600" height="980" fill="#ffffff"/>
  <path d="M0 0 H1600 V980 H0 Z" fill="none" stroke="#e7edf6"/>

  <text class="eyebrow" x="92" y="86">SYSTEM BLUEPRINT · 2026.09</text>
  <text class="title" x="92" y="159">이동은 넓게, 조작은 정밀하게, 결과는 계측한다.</text>
  <text class="subtitle" x="92" y="207">ROS 2가 작업 흐름을 연결하고, C++이 동작과 안전을 지키며, Python이 인지와 ACT 학습을 맡는다.</text>
  <rect x="1244" y="64" width="264" height="38" rx="19" fill="#111827"/>
  <text class="chip" x="1376" y="88" text-anchor="middle" fill="#ffffff">ISAAC SIM 6.0 · ROS 2</text>

  <g aria-label="mission flow">
    <line x1="124" y1="276" x2="1476" y2="276" stroke="#dbe7fa" stroke-width="6" stroke-linecap="round"/>
    <line x1="124" y1="276" x2="1476" y2="276" stroke="#1261ff" stroke-width="3" stroke-linecap="round" marker-end="url(#arrow-blue)"/>
    <g fill="#fff" stroke="#1261ff" stroke-width="3">
      <circle cx="164" cy="276" r="15"/><circle cx="478" cy="276" r="15"/><circle cx="792" cy="276" r="15"/><circle cx="1106" cy="276" r="15"/><circle cx="1420" cy="276" r="15"/>
    </g>
    <g class="flow-label" text-anchor="middle">
      <text x="164" y="245">MAP</text><text x="478" y="245">ALIGN</text><text x="792" y="245">GRASP</text><text x="1106" y="245">POUR</text><text x="1420" y="245">WEIGH</text>
    </g>
  </g>

  <g transform="translate(92 338)">
    <text class="layer-label" x="0" y="0">01 · ORCHESTRATION</text>
    <rect x="0" y="22" width="1416" height="112" rx="18" fill="#f7faff" stroke="#dce8fb" filter="url(#shadow)"/>
    <rect x="26" y="46" width="108" height="28" rx="14" fill="#e7efff"/>
    <text class="chip" x="80" y="65" text-anchor="middle" fill="#1261ff">PYTHON</text>
    <text class="card-title" x="158" y="68">mission_manager · recovery_supervisor</text>
    <text class="card-copy" x="158" y="104">NavigateToPose → 작업 셀 정렬 → 양팔 스킬 → 계측 검증을 Action 결과로 연결한다.</text>
    <text class="card-copy" x="1072" y="68">허용 복구만 선택</text>
    <text class="card-copy" x="1072" y="104">재관측 · 재파지 · 추가 붓기 · 중단</text>
  </g>

  <g transform="translate(92 510)">
    <text class="layer-label" x="0" y="0">02 · NAVIGATION &amp; LOCAL PERCEPTION</text>
    <rect x="0" y="22" width="690" height="142" rx="18" fill="#f7faff" stroke="#dce8fb" filter="url(#shadow)"/>
    <rect x="26" y="48" width="84" height="28" rx="14" fill="#1261ff"/>
    <text class="chip" x="68" y="67" text-anchor="middle" fill="#fff">C++</text>
    <text class="card-title" x="132" y="70">SLAM Toolbox · AMCL · Nav2</text>
    <text class="card-copy" x="26" y="110">2D LiDAR와 odom으로 지도를 만들고 작업대 대기점까지 이동한다.</text>
    <text class="card-copy" x="26" y="140">내비게이션 성공과 조작 성공은 별도 지표로 남긴다.</text>

    <rect x="726" y="22" width="690" height="142" rx="18" fill="#f3fbfb" stroke="#ccecee" filter="url(#shadow)"/>
    <rect x="752" y="48" width="108" height="28" rx="14" fill="#dff5f6"/>
    <text class="chip" x="806" y="67" text-anchor="middle" fill="#007f8b">PYTHON</text>
    <text class="card-title" x="882" y="70">RGB-D · AprilTag · tf2</text>
    <text class="card-copy" x="752" y="110">태그와 깊이로 workcell 좌표를 만들고 마지막 위치 오차를 줄인다.</text>
    <text class="card-copy" x="752" y="140">map → base_link → camera → workcell 시간축을 검증한다.</text>
  </g>

  <g transform="translate(92 722)">
    <text class="layer-label" x="0" y="0">03 · MANIPULATION, LEARNING &amp; SAFETY</text>
    <rect x="0" y="22" width="440" height="144" rx="18" fill="#f7faff" stroke="#dce8fb" filter="url(#shadow)"/>
    <rect x="26" y="48" width="84" height="28" rx="14" fill="#1261ff"/>
    <text class="chip" x="68" y="67" text-anchor="middle" fill="#fff">C++</text>
    <text class="card-title" x="132" y="70">MoveIt 2 · IK</text>
    <text class="card-copy" x="26" y="110">파지·기울임·복귀의 결정론적 기준선</text>
    <text class="card-copy" x="26" y="140">충돌 장면과 양팔 궤적을 함께 검사</text>

    <rect x="478" y="22" width="440" height="144" rx="18" fill="#f3fbfb" stroke="#ccecee" filter="url(#shadow)"/>
    <rect x="504" y="48" width="108" height="28" rx="14" fill="#dff5f6"/>
    <text class="chip" x="558" y="67" text-anchor="middle" fill="#007f8b">PYTHON</text>
    <text class="card-title" x="634" y="70">LeRobot ACT</text>
    <text class="card-copy" x="504" y="110">실물 양팔 시연에서 짧은 조작 구간 학습</text>
    <text class="card-copy" x="504" y="140">내비게이션과 안전 정지는 학습하지 않음</text>

    <rect x="956" y="22" width="460" height="144" rx="18" fill="#fff9f2" stroke="#f1dfc7" filter="url(#shadow)"/>
    <rect x="982" y="48" width="84" height="28" rx="14" fill="#111827"/>
    <text class="chip" x="1024" y="67" text-anchor="middle" fill="#fff">C++</text>
    <text class="card-title" x="1088" y="70">command_mux · safety_guard</text>
    <text class="card-copy" x="982" y="110">IK·ACT·텔레옵 중 한 명령 소유자만 허용</text>
    <text class="card-copy" x="982" y="140">관절 한계·타임아웃·팔 간 거리 위반 시 정지</text>
  </g>

  <g aria-hidden="true">
    <line x1="800" y1="472" x2="800" y2="500" stroke="#98a4b5" stroke-width="2" marker-end="url(#arrow-slate)"/>
    <line x1="800" y1="674" x2="800" y2="712" stroke="#98a4b5" stroke-width="2" marker-end="url(#arrow-slate)"/>
  </g>

  <rect x="92" y="928" width="1416" height="1" fill="#dfe6ef"/>
  <text class="footer" x="92" y="960">HARDWARE · 모바일 베이스 · SO-101 ×2 · 평행 그리퍼 ×2 · FSR ×4 · 병/컵 로드셀 도킹 패드 ×2</text>
</svg>
