    zero_pose_clearance: pass
    zero_pose_clearance_findings_mm:
      cross_arm_link_minimum: 75.60
      gripper_to_other_arm_minimum: 67.70
      mast_centerline_radius_minimum: 91.66
      arm_to_lidar_surface_minimum: 28.83
      triangle_collision_pairs: 0
    pour_joint_limits: pass
    pour_limit_violations: []
    pour_tcp_target_match: fail_targets_stored_as_constants_not_fk
    tool0_to_documented_target_gap_mm: 58.1
    resolved_2026_09_03:
      - add_left_and_right_tool0_frames
      - add_bottle_and_cup_tcp_frames
      - resolve_servo_zero_to_urdf_joint_convention
    required_before_replanning:
      - recompute_ik_with_current_urdf_limits
      - verify_fk_collision_and_physical_zero_pose
      - replace_documented_task_targets_with_fk_derived_values
  cup_gripper_xyz: [301.7, 47.3, 444.6]
  bottle_gripper_pour_xyz: [271.7, 114.9, 539.5]
  bottle_cap_pour_xyz: [301.8, 47.2, 509.1]
  bottle_tilt_from_upright: 112.3
  cup_rim_estimated_xyz: [301.7, 47.3, 484.6]
  bottle_cap_clearance_above_cup_rim: 24.5
  gripper_center_separation_pour: 120.0
  nominal_camera_range_to_cup: 523.7
  nominal_camera_range_to_bottle: 452.5
  nominal_camera_pitch_range_to_task: [36.5, 43.0]
  fixed_horizontal_reach_limit_status: replaced_by_pose_specific_gravity_torque_gate
  selected_pose_gripper_offset_from_arm_base_max: 280.0
  initial_payload_max_each: 0.060
  gated_payload_next_each: 0.120
  payload_0_140_status: requires_current_temperature_and_stability_pass
  payload_0_200_status: rejected_for_current_pour_geometry
  payload_0_300_status: rejected_for_current_pour_geometry
  source_container:
    capacity_range_mL: [200, 330]
    fill_fraction_min: 0.40
    fill_volume_max_mL: 50
    diameter_range_mm: [50, 72]
    rationale: |
      허용 하중은 500 mL 병에 물 95 mL 로도 만족하지만, 그 경우 충전율이 19%라
      임계각 근처에서 급격히 쏟아져 각도-유량 관계가 비선형이 된다. 같은 물
      양이라도 작은 병이 충전율이 높아 붓기 제어가 쉽다. 지름 상한 72 mm 는
      V홈 인서트 135도·홈 폭 30 mm 의 커버 범위다.
  transport_joint_degrees:
    status: fk_solved_2026_09_03_clearance_pass
    solver: src/hold_flow_description/scripts/solve_task_poses.py
    tool0_target_m: [0.06, 0.10, 0.26]
    left: [-19.0, -95.1, 60.1, 78.4, -1.0]
    right: [19.0, -95.1, 60.1, 78.4, 1.2]
  pour_joint_degrees:
    status: infeasible_workcell_too_far_do_not_execute
    finding: |
      문서의 붓기 좌표는 팔 베이스 기준 443~492 mm 로, 랜덤 샘플로 측정한 최대
      도달(tool0 486.9, cup_tcp 490.7, bottle_tcp 513.9 mm)의 96~97% 지점이다.
      기하학적으로는 닿지만 팔이 거의 펴진 특이자세라 IK 해가 사실상 없고,
      중력토크도 정격의 96.6% 로 같은 지점에서 최대가 된다. 위치만 맞춘 해는
      한계 안에 들지만 양팔이 6쌍 충돌한다.
      작업 셀을 로봇 쪽으로 당기거나 Nav2 정지 위치를 앞으로 옮겨야 한다.
    reach_budget_mm:
      tool0_max: 486.9
      cup_tcp_max: 490.7
      bottle_tcp_max: 513.9
      documented_cup_rim: 473.3
      documented_bottle_cap_pour: 492.5
    left_bottle: [-23.1, -41.3, -4.0, 6.7, 2.4]
    right_cup: [-44.8, -26.7, -1.1, -4.9, 12.5]

