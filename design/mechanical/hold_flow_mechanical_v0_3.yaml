simulation:
  target: NVIDIA_Isaac_Sim_6_0
  urdf_import:
    robot_type: Mobile Manipulators
    fix_base: false
    merge_fixed_joints: false
    collision_from_visuals: false
    allow_self_collision: false
    joint_drive_type: position
  timestep_hz_candidate: 120
  collision_policy:
    custom_structure: primitive_convex_collision
    so101_links: upstream_mesh_collision_pending_convex_decomposition_for_realtime
    right_gripper: project_proxy_primitives
  drive_gain_policy:
    arm_position_gains: apply_and_tune_in_usd_after_import
    wheel_velocity_gains: apply_and_tune_in_usd_after_import
    no_unverified_gain_claims: true
  runtime_status_on_authoring_host: isaac_sim_not_installed_static_validation_only

compute_plan:
  current:
    architecture: onboard_base_io_plus_wireless_notebook_gpu
    onboard_scope: wheel_servo_io_watchdog_lidar_and_ros2_transport
    notebook_scope: ACT_inference_RGBD_perception_training_and_visualization
  later_raspberry_pi_5:
    priority: deferred
    scope: Nav2_SLAM_sensor_drivers_base_driver_mission_safety_and_logging
    keep_on_notebook: ACT_and_heavy_vision_inference
    transport: wired_or_wifi_ros2_with_deadline_watchdog_and_local_stop
    migration_gate: measure_cpu_memory_temperature_network_latency_and_packet_loss_before_cutover

verification:
  required:
    - xacro_expands
    - check_urdf_passes
    - committed_urdf_matches_xacro
    - cad_assembly_placements_match_this_spec
    - all_non_frame_links_have_positive_mass_and_positive_definite_inertia
    - visual_and_collision_sets_match
    - tabletop_arm_camera_and_four_wheel_coordinates_match_this_spec
    - isaac_import_contract_static_check_passes
  physical_measurement_blockers:
    - tabletop_material_and_actual_mass
    - extrusion_catalog_mass_and_fastener_locations
    - so101_mount_hole_pattern
    - left_cup_overcap_jaw_fit
    - right_gripper_wrist_transform_and_exact_collision_mesh
    - four_wheel_axle_positions_effective_track_contact_heights_and_load_distribution
    - camera_extrinsic_and_intrinsic_calibration
